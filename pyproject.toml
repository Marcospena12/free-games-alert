[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-games-hub"
version = "0.2.0"
description = "Central desktop de jogos gratuitos com RSS da comunidade Steam e ofertas multi-loja via GamerPower."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Marcos" }]
keywords = ["steam", "epic", "gog", "jogos", "giveaways", "notificacoes", "desktop"]
dependencies = [
    "PySide6>=6.6",
    "feedparser>=6.0",
    "desktop-notifier>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.10", "pillow>=10.0"]

[project.scripts]
free-games-hub = "free_games_hub.__main__:main"

[project.gui-scripts]
free-games-hub-gui = "free_games_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: testes que acessam o feed real da internet (nao rodam por padrao).",
]
