name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só buildar e subir artefatos do workflow (sem Release)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  tests:
    name: Testes (Windows / Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rodar testes
        run: python -m pytest

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar Python (build) e Node
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
          npm ci --prefix desktop

      - name: Build desktop (SPA + backend + instalador)
        run: python scripts/build_desktop.py --skip-tests

      - name: Subir artefatos
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libxss1 libasound2 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxcomposite1 \
            libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libxtst6
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
          npm ci --prefix desktop

      - name: Build desktop (SPA + backend + instaladores)
        run: python scripts/build_desktop.py --skip-tests

      - name: Subir artefatos
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'push'
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gerar SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar Release e publicar artefatos
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/SHA256SUMS.txt
